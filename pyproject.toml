[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perla-extract"
version = "0.0.6"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Sherjeel Shabih", email = "sherjeel.shabih@hu-berlin.de" },
    { name = "Pepe Marquez", email = "jose.marquez@physik.hu-berlin.de" },
    { name = "Kevin Jablonka", email = "mail@kjablonka.com" },
    { name = "Sharat Patil", email = "sharat.patil@physik.hu-berlin.de" },
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.1",
    "docling",
    # LiteLLM 1.98 imports typing.NotRequired, which exists only on Python 3.11+.
    "litellm>=1.77.7,<1.97; python_version < '3.11'",
    "litellm>=1.77.7; python_version >= '3.11'",
    "loguru>=0.7",
    "openpyxl>=3.1",
    "pint>=0.24",
    "pydantic>=2.8",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
papersbot = ["feedparser>=6.0", "requests>=2.31"]
dev = [
    "build",
    "feedparser>=6.0",
    "PyJWT[crypto]>=2.10",
    "pytest",
    "requests>=2.31",
    "ruff",
]
nomad = [
    "perovskite-solar-cell-database==1.2.14",
    # Undeclared imports in that pinned release; keep them outside normal installs.
    "structlog>=24,<27",
    "temporalio>=1,<2",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.22.0",
]

[project.scripts]
perla-extract = "perla_extract.study_extraction.cli:main"
perla-papersbot = "perla_extract.papersbot.cli:main"

[tool.setuptools.package-data]
"perla_extract.papersbot" = ["feeds.txt", "selection.json"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
