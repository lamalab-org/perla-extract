[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "perovscribe"
version = "0.0.1"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Sherjeel Shabih", email = "" },
    { name = "Sreekanth Kunchapu", email = "" },
    { name = "Pepe Marquez", email = "" },
    { name = "Kevin Jablonka", email = "mail@kjablonka.com" },
]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]


dependencies = ["pydantic", "litellm"]
[project.optional-dependencies]
dev = ["jupyter", "docformatter", "pytest", "ruff", "bump-my-version"]
nougat = ["nougat"]
marker = ["marker-pdf"]

docs = [
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.22.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
]
