[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perla-extract"
version = "0.0.6"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Sherjeel Shabih", email = "sherjeel.shabih@hu-berlin.de" },
    { name = "Pepe Marquez", email = "jose.marquez@physik.hu-berlin.de" },
    { name = "Kevin Jablonka", email = "mail@kjablonka.com" },
    { name = "Sharat Patil", email = "sharat.patil@physik.hu-berlin.de" },
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.1",
    "litellm>=1.77.7",
    "loguru>=0.7",
    "pydantic>=2.8",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
docling = ["docling"]
papersbot = ["feedparser>=6.0", "requests>=2.31"]
dev = ["build", "feedparser>=6.0", "pytest", "requests>=2.31", "ruff"]
docs = [
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.22.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
]

[project.scripts]
perla-extract = "perla_extract.study_extraction.cli:main"
perla-papersbot = "perla_extract.papersbot.cli:main"

[tool.setuptools.package-data]
"perla_extract.papersbot" = ["feeds.txt", "selection.json"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
