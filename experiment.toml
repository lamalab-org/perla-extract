# Compare refinement on the committed development set. Put original PDFs in papers/.
output = "results/refinement"
repeats = 1
dataset = "benchmarks/development/papers.json"
sources = "papers"

[stages.default]
model = "openai/gpt-6.1-sol"
reasoning_effort = "medium"
max_output_tokens = 40000

[extraction]
use_claim_ledger = false
use_targeted_repair = false
use_enrichment = false
max_model_calls = 2

[control]
use_refinement = false

[treatment]
use_refinement = true
