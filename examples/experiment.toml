# Copy to the repository root and use your separate model-labeled development papers.
# Question: does one refinement call improve a direct extraction?
output = "results/refinement"
repeats = 1

[stages.default]
model = "openai/gpt-6.1-sol"
reasoning_effort = "medium"
max_output_tokens = 40000

[extraction]
use_claim_ledger = false
use_targeted_repair = false
use_enrichment = false
max_model_calls = 2

[control]
use_refinement = false

[treatment]
use_refinement = true

[[papers]]
pdf = "papers/dev-paper.pdf"
supplement = "papers/dev-paper-SI.pdf"
reference = "references/dev-paper"
