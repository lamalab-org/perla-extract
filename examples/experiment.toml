# Copy to the repository root as experiment.toml, then set your input paths.
# This reference is included; its original paper and SI PDFs must be supplied.
output = "results/readings"
repeats = 1

[extraction]
model = "openai/gpt-5.2"
parser = "pymupdf"
max_model_calls = 14

# Everything else is identical in both arms.
[control]
claim_recall_passes = 1

[treatment]
claim_recall_passes = 2

[[papers]]
pdf = "papers/10.1002--adfm.201904856.pdf"
supplement = "papers/10.1002--adfm.201904856-SI.pdf"
reference = "data/study_extraction/ground_truth/v2/dev/10.1002--adfm.201904856"
