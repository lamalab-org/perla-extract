defaults:
  - _self_

# Pipeline settings
input_folder: "/home/ta45woj/perovskite-extraction/papers"
output_folder: "/home/ta45woj/perovskite-extraction/output"
cache_dir: ".cache"
vision_model: false

# LLM call settings
llm:
  model: "claude-3-5-sonnet-20240620"
  max_tokens: 8192
  temperature: 0
  prompts:
    system: >
      You are a world-class AI that excels at extracting data about perovskite solar cells from papers.
      You only report single-junction solar cells and no other types of solar cells.
      You never invent data and only state data measured in the paper and which you can confidently extract.
      You should skip rather than report data you are uncertain about.
      Take care to separate devices.
      Do not extract data people took from other papers; only extract data reported for the first time in this paper.
      Do not convert units yourself; stick to the units reported in the paper.
      Be careful with decimal points.
      Do not perform multistep conversions or calculations.
      Stick to what is reported.
      Be careful that the data you put together belongs to the same device.
    vision_instruction: >
      Extract the data from the images of the paper.
      Do only report data about devices for which you are certain that the extraction you provide is correct.
      Do not convert any value or unit.
    text_instruction: >
      Extract the data from the text of the paper.
      Do only report data about devices for which you are certain that the extraction you provide is correct.
      Do not convert any value or unit.
