name: Discover papers

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UNPAYWALL_EMAIL: ${{ vars.OA_EMAIL }}

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PapersBot
        run: python -m pip install ".[papersbot]"
      - name: Restore incremental state
        uses: actions/cache@v4
        with:
          path: .papersbot-state
          key: papersbot-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            papersbot-${{ github.ref_name }}-
      - name: Discover open papers
        run: perla-papersbot downloaded_papers
      - name: Preserve downloaded papers and state
        uses: actions/upload-artifact@v4
        with:
          name: papersbot-${{ github.run_id }}
          path: |
            downloaded_papers
            .papersbot-state/state.json
          if-no-files-found: warn
          retention-days: 30
