name: Discover papers

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: papersbot-${{ github.ref }}
  cancel-in-progress: false

env:
  UNPAYWALL_EMAIL: ${{ vars.OA_EMAIL }}
  OPENALEX_EMAIL: ${{ vars.OA_EMAIL }}
  ZOTERO_GROUP_ID: ${{ vars.ZOTERO_GROUP_ID }}
  ZOTERO_COLLECTION_KEY: ${{ vars.ZOTERO_COLLECTION_KEY }}
  ZOTERO_CURATED: ${{ vars.ZOTERO_CURATED }}
  ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PapersBot
        run: python -m pip install ".[papersbot]"
      - name: Restore incremental state
        uses: actions/cache@v4
        with:
          path: .papersbot-state
          key: papersbot-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            papersbot-${{ github.ref_name }}-
      - name: Discover open papers
        run: >-
          perla-papersbot downloaded_papers
          --log-file papersbot.log.jsonl
          > papersbot-result.json
      - name: Preserve state and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papersbot-${{ github.run_id }}
          path: |
            .papersbot-state
            papersbot-result.json
            papersbot.log.jsonl
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve downloaded PDFs
        if: always() && vars.PAPERSBOT_ARCHIVE_PDFS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: papersbot-pdfs-${{ github.run_id }}
          path: downloaded_papers
          if-no-files-found: warn
          retention-days: 30
