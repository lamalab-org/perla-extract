name: Test Python package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reference-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install scoring dependencies
        run: python -m pip install -r examples/scoring/requirements.txt pytest
      - name: Verify the complete published reference release without model calls
        env:
          PYTHONPATH: .:src
          PERLA_RUN_REFERENCE_RELEASE_TESTS: "1"
        run: >-
          python -m pytest -q
          tests/study_extraction/test_reference_release.py
          tests/study_extraction/test_reference_dataset.py
      - name: Audit finalized references and declared review coverage
        env:
          PYTHONPATH: .:src
        run: >-
          python -m examples.scoring.reference_audit
          --release data/study_extraction/ground_truth/v2/release.json
          --output "${{ runner.temp }}/reference-audit-v2.json"
      - name: Verify generated context controls without new labels or model calls
        env:
          PYTHONPATH: .:src
        run: >-
          python -m examples.scoring.validate
          --release data/study_extraction/ground_truth/v2/release.json
          --output "${{ runner.temp }}/context-controls.json"
      - name: Preserve the public reference audit
        uses: actions/upload-artifact@v4
        with:
          name: reference-audit-v2
          path: |
            ${{ runner.temp }}/reference-audit-v2.json
            ${{ runner.temp }}/context-controls.json
          if-no-files-found: error

  review-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deployment dependencies and test runner
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tomllib
          config = tomllib.loads(pathlib.Path("review_workbench/pyproject.toml").read_text())
          subprocess.check_call([sys.executable, "-m", "pip", "install", "pytest", *config["project"]["dependencies"]])
          PY
      - name: Test the prepared server with its real storage SDK
        run: python -m pytest -q review_workbench/tests/test_prepare.py
      - name: Exercise reviewer modules and the offline demo
        run: >-
          python -m pytest -q review_workbench/tests/test_review_state.py
          review_workbench/tests/test_review_modules.py
          review_workbench/tests/test_frontend.py review_workbench/tests/test_demo.py

  scoring-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned example environment
        run: python -m pip install -r examples/scoring/requirements.txt
      - name: Reproduce review-to-score example without provider SDKs
        env:
          PYTHONPATH: .:src
        run: python -m examples.scoring.run --output "${{ runner.temp }}/perla-scoring-example"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install documentation tools
        run: python -m pip install ".[docs]"
      - name: Build documentation
        run: python -m mkdocs build --strict

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package and development tools
        run: python -m pip install ".[dev]"
      - name: Lint
        run: python -m ruff check src tests review_workbench examples
      - name: Type-check extraction contracts
        run: python -m mypy src/perla_extract/study_extraction

  docling:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      HF_HOME: ${{ github.workspace }}/.parser-models/huggingface
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install parser test environment
        run: python -m pip install ".[dev]"
      - uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: ${{ runner.os }}-docling-${{ hashFiles('pyproject.toml') }}
      - name: Prepare local parser weights using invented PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from tests.study_extraction.test_docling_integration import _authored_table_pdf
          from perla_extract.study_extraction.source import parse_pdf
          with TemporaryDirectory() as directory:
              for rasterized in (False, True):
                  path = Path(directory) / f"authored-{rasterized}.pdf"
                  _authored_table_pdf(path, rasterized=rasterized)
                  parse_pdf(path, "main", parser="docling", heartbeat_seconds=0)
          PY
      - name: Test native and OCR content with network forbidden
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PERLA_RUN_DOCLING_TESTS: "1"
          PERLA_RUN_DOCLING_OCR_TESTS: "1"
        run: python -m pytest -q -ra tests/study_extraction/test_docling_integration.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package and development tools
        run: python -m pip install ".[dev]"
      - name: Test
        run: python -m pytest -q

  nomad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned NOMAD integration
        run: python -m pip install ".[dev,nomad]"
      - name: Test outbound NOMAD schema contract
        env:
          PERLA_RUN_NOMAD_TESTS: "1"
        run: python -m pytest -q tests/study_extraction/test_nomad_integration.py
