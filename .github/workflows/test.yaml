name: Test Python package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install documentation tools
        run: python -m pip install ".[docs]"
      - name: Build documentation
        run: python -m mkdocs build --strict

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package and development tools
        run: python -m pip install ".[dev]"
      - name: Lint
        run: python -m ruff check src tests review_workbench
      - name: Type-check extraction contracts
        run: python -m mypy src/perla_extract/study_extraction

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install ".[dev]"
      - name: Test
        run: python -m pytest -q

  docling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Docling integration
        run: python -m pip install ".[dev]"
      - name: Test Docling parser contract
        env:
          PERLA_RUN_DOCLING_TESTS: "1"
        run: python -m pytest -q tests/study_extraction/test_docling_integration.py

  nomad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned NOMAD integration
        run: python -m pip install ".[dev,nomad]"
      - name: Test outbound NOMAD schema contract
        env:
          PERLA_RUN_NOMAD_TESTS: "1"
        run: python -m pytest -q tests/study_extraction/test_nomad_integration.py
